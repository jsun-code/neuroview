<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="400" height="220">
  <defs>
    <linearGradient id="bg_cover-brain-death" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#120808"/>
      <stop offset="100%" stop-color="#1a0d0d"/>
    </linearGradient>
  </defs>
  <rect width="400" height="220" fill="url(#bg_cover-brain-death)"/>
  
          <!-- EEG waveform -->
          <polyline points="20,130 50,130 60,110 70,150 80,90 90,170 100,120 110,130 140,130 155,115 165,145 175,100 185,160 195,125 205,130 230,130 240,112 250,148 260,95 270,165 280,122 290,130 320,130 335,118 345,142 355,108 365,155 375,128 385,130" 
            fill="none" stroke="#F87171" stroke-width="2" opacity="0.75"/>
          <!-- gamma burst highlight -->
          <rect x="155" y="85" width="140" height="60" rx="4" fill="#F87171" opacity="0.06"/>
          <rect x="155" y="85" width="140" height="60" rx="4" fill="none" stroke="#F87171" stroke-width="1" opacity="0.3"/>
          <!-- label -->
          <text x="225" y="82" font-size="9" fill="#F87171" opacity="0.6" text-anchor="middle" font-family="monospace">γ BURST</text>
          <!-- brain outline faint -->
          <ellipse cx="200" cy="155" rx="100" ry="45" fill="none" stroke="#F87171" stroke-width="1" opacity="0.15"/>
          <!-- heartbeat flatline at bottom -->
          <line x1="20" y1="195" x2="160" y2="195" stroke="#F87171" stroke-width="1.5" opacity="0.3"/>
          <polyline points="160,195 170,175 180,215 190,195 380,195" fill="none" stroke="#F87171" stroke-width="1.5" opacity="0.3"/>
        
</svg>