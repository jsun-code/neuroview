<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="400" height="220">
  <defs>
    <linearGradient id="bg_cover-bcis" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0b1e"/>
      <stop offset="100%" stop-color="#1a1540"/>
    </linearGradient>
  </defs>
  <rect width="400" height="220" fill="url(#bg_cover-bcis)"/>
  
          <!-- Brain silhouette with electrode dots -->
          <ellipse cx="200" cy="130" rx="90" ry="70" fill="none" stroke="#7F77DD" stroke-width="1.5" opacity="0.6"/>
          <ellipse cx="200" cy="120" rx="55" ry="45" fill="none" stroke="#534AB7" stroke-width="1" opacity="0.5"/>
          <!-- electrode dots -->
          <circle cx="140" cy="95" r="4" fill="#AFA9EC"/>
          <circle cx="200" cy="75" r="4" fill="#AFA9EC"/>
          <circle cx="260" cy="95" r="4" fill="#AFA9EC"/>
          <circle cx="270" cy="145" r="4" fill="#AFA9EC"/>
          <circle cx="130" cy="145" r="4" fill="#AFA9EC"/>
          <!-- signal lines -->
          <line x1="140" y1="95" x2="140" y2="60" stroke="#7F77DD" stroke-width="1.5" opacity="0.7"/>
          <line x1="200" y1="75" x2="200" y2="40" stroke="#7F77DD" stroke-width="1.5" opacity="0.7"/>
          <line x1="260" y1="95" x2="260" y2="60" stroke="#7F77DD" stroke-width="1.5" opacity="0.7"/>
          <!-- robotic arm hint -->
          <rect x="310" y="100" width="50" height="12" rx="6" fill="none" stroke="#534AB7" stroke-width="1.5" opacity="0.5"/>
          <rect x="350" y="88" width="12" height="36" rx="4" fill="none" stroke="#534AB7" stroke-width="1.5" opacity="0.5"/>
          <!-- pulse wave -->
          <polyline points="20,160 50,160 65,140 80,180 95,130 110,165 130,165" fill="none" stroke="#7F77DD" stroke-width="1.5" opacity="0.5"/>
        
</svg>