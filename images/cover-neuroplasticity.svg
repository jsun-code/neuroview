<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="400" height="220">
  <defs>
    <linearGradient id="bg_cover-neuroplasticity" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1218"/>
      <stop offset="100%" stop-color="#111a28"/>
    </linearGradient>
  </defs>
  <rect width="400" height="220" fill="url(#bg_cover-neuroplasticity)"/>
  
          <!-- Branching neuron tree -->
          <!-- main axon -->
          <line x1="200" y1="210" x2="200" y2="150" stroke="#38BDF8" stroke-width="2" opacity="0.7"/>
          <!-- primary branches -->
          <line x1="200" y1="150" x2="150" y2="110" stroke="#38BDF8" stroke-width="1.5" opacity="0.65"/>
          <line x1="200" y1="150" x2="250" y2="110" stroke="#38BDF8" stroke-width="1.5" opacity="0.65"/>
          <line x1="200" y1="130" x2="160" y2="100" stroke="#38BDF8" stroke-width="1.2" opacity="0.5"/>
          <line x1="200" y1="130" x2="240" y2="100" stroke="#38BDF8" stroke-width="1.2" opacity="0.5"/>
          <!-- secondary -->
          <line x1="150" y1="110" x2="120" y2="80" stroke="#7DD3FC" stroke-width="1" opacity="0.6"/>
          <line x1="150" y1="110" x2="165" y2="78" stroke="#7DD3FC" stroke-width="1" opacity="0.6"/>
          <line x1="250" y1="110" x2="235" y2="78" stroke="#7DD3FC" stroke-width="1" opacity="0.6"/>
          <line x1="250" y1="110" x2="278" y2="82" stroke="#7DD3FC" stroke-width="1" opacity="0.6"/>
          <!-- dendrite tips (dots) -->
          <circle cx="120" cy="80" r="4" fill="#38BDF8" opacity="0.8"/>
          <circle cx="165" cy="78" r="4" fill="#38BDF8" opacity="0.8"/>
          <circle cx="235" cy="78" r="4" fill="#38BDF8" opacity="0.8"/>
          <circle cx="278" cy="82" r="4" fill="#38BDF8" opacity="0.8"/>
          <circle cx="200" cy="55" r="5" fill="#7DD3FC" opacity="0.6"/>
          <line x1="200" y1="150" x2="200" y2="60" stroke="#38BDF8" stroke-width="1" opacity="0.4"/>
          <!-- soma -->
          <circle cx="200" cy="150" r="12" fill="#0ea5e9" opacity="0.35"/>
          <circle cx="200" cy="150" r="7" fill="#38BDF8" opacity="0.5"/>
          <!-- glowing pulse rings -->
          <circle cx="200" cy="150" r="22" fill="none" stroke="#38BDF8" stroke-width="1" opacity="0.2"/>
          <circle cx="200" cy="150" r="35" fill="none" stroke="#38BDF8" stroke-width="1" opacity="0.1"/>
        
</svg>