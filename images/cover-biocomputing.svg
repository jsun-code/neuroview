<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="400" height="220">
  <defs>
    <linearGradient id="bg_cover-biocomputing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071a0e"/>
      <stop offset="100%" stop-color="#0d2818"/>
    </linearGradient>
  </defs>
  <rect width="400" height="220" fill="url(#bg_cover-biocomputing)"/>
  
          <!-- Organoid + circuit hybrid -->
          <circle cx="200" cy="125" r="65" fill="none" stroke="#059669" stroke-width="1.5" opacity="0.4"/>
          <circle cx="200" cy="125" r="45" fill="none" stroke="#10B981" stroke-width="1" opacity="0.5"/>
          <!-- neuron blobs inside -->
          <circle cx="185" cy="110" r="8" fill="#059669" opacity="0.35"/>
          <circle cx="215" cy="120" r="10" fill="#10B981" opacity="0.35"/>
          <circle cx="195" cy="140" r="7" fill="#059669" opacity="0.35"/>
          <!-- connection lines -->
          <line x1="185" y1="110" x2="215" y2="120" stroke="#34D399" stroke-width="1" opacity="0.6"/>
          <line x1="215" y1="120" x2="195" y2="140" stroke="#34D399" stroke-width="1" opacity="0.6"/>
          <line x1="195" y1="140" x2="185" y2="110" stroke="#34D399" stroke-width="1" opacity="0.6"/>
          <!-- circuit traces -->
          <polyline points="80,125 120,125 130,100 155,100" fill="none" stroke="#34D399" stroke-width="1.5" opacity="0.5"/>
          <polyline points="80,145 115,145 125,160 155,160" fill="none" stroke="#34D399" stroke-width="1.5" opacity="0.5"/>
          <polyline points="245,100 275,100 285,125 320,125" fill="none" stroke="#34D399" stroke-width="1.5" opacity="0.5"/>
          <polyline points="245,150 270,150 285,145 320,145" fill="none" stroke="#34D399" stroke-width="1.5" opacity="0.5"/>
          <!-- chip squares -->
          <rect x="60" y="105" width="20" height="20" rx="2" fill="none" stroke="#34D399" stroke-width="1.5" opacity="0.6"/>
          <rect x="320" y="105" width="20" height="20" rx="2" fill="none" stroke="#34D399" stroke-width="1.5" opacity="0.6"/>
        
</svg>